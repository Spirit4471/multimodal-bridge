# Quick overlay for testing the plugin WITHOUT a profile.
#
# 1. Build once:        cd dsh-plugin && npm install && npm run build
# 2. Fix the path below to point at THIS checkout's built entry on your machine.
#    Windows: file:///C:/... URL form (plain C:/... is rejected as a "c:" scheme).
#    POSIX:   /absolute/path/to/... plain absolute path.
# 3. Run from the repo root:  dsh web --patch ./dsh-plugin/overlay.example.yml --port 3081
#
# The overlay inserts the same row the published bundle patch inserts, but
# references the built module by file URL instead of by package name, so
# no `dsh plugin add` / npm publish step is needed.
#
# Profile-based install (recommended for daily use) is documented in README.md;
# this overlay is for development smoke-testing only.
- insert:
    - id: multimodal-bridge
      name: 'file:///C:/WorkSpace/multimodal-bridge/dsh-plugin/lib/index.js'
      config:
        apiKey: ''
        # Empty = env QWEN_API_BASE wins (set it in ~/.dsh/.env), then the
        # official DashScope endpoint. Pin a URL here only to override env.
        apiBase: ''
        visionModel: qwen-vl-max
        generateModel: qwen-image-2.0
        generateFallbackModels:
          - wan2.7-image
          - qwen-image-2.0
          - wan2.7-image-pro
          - wan2.1-t2i-turbo
        # Register generated images as durable attachments and surface them
        # in the tool-result card (UI-only display; never enters the model
        # request, which text-only adapters would reject).
        attachGeneratedImages: true
        outputDir: generated
