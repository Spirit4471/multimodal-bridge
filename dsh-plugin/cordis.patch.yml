# multimodal-bridge bundle layer for DeepSeek Harness profiles.
#
# One insert over the profile root; the row registers the `qwen_vision` and
# `qwen_generate` tools through the package entry `dsh-multimodal-bridge`.
# Users may override any field from their own profile `cordis.patch.yml`
# (a patch replaces a row's WHOLE config, so restate fields you keep).
#
# A bundle is loaded by adding its package name to `dsh.profile.bundles`,
# which `dsh plugin add dsh-multimodal-bridge` does automatically.
- insert:
    - id: multimodal-bridge
      name: dsh-multimodal-bridge
      config:
        # Qwen (DashScope / 百炼) API key. Empty = fall back to
        # QWEN_DASHSCOPE_API_KEY (or VISION_API_KEY / GENERATE_API_KEY)
        # from the environment, so keys never have to live in this file.
        apiKey: ''
        # Empty = use the environment (QWEN_API_BASE), then the official
        # DashScope endpoint. Gateway users set QWEN_API_BASE in ~/.dsh/.env,
        # e.g. https://ws-xxxx.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        # The client auto-detects the protocol from the URL. Pinning a URL
        # here OVERRIDES the environment.
        apiBase: ''
        visionModel: qwen-vl-max
        visionFallbackModels:
          - qwen-vl-plus
          - qwen3-vl-plus
          - qwen3-vl-flash
        generateModel: qwen-image-2.0
        # Models tried in order when the preferred one fails with a
        # gateway-side routing error (a workspace gateway exposes only a
        # subset of the models the key has quota for).
        generateFallbackModels:
          - wan2.7-image
          - qwen-image-2.0
          - wan2.7-image-pro
          - wan2.1-t2i-turbo
        # Text-to-video models (native DashScope async video-synthesis).
        # Try them in order; models the key cannot use (AccessDenied /
        # not exist / quota) are skipped automatically.
        videoModel: wanx2.1-t2v-turbo
        videoFallbackModels:
          - wanx2.1-t2v-plus
          - wan2.6-t2v
          - wan2.7-t2v
        # Image-to-video models (used when qwen_video receives image_path).
        videoI2vModel: wanx2.1-i2v-turbo
        videoI2vFallbackModels:
          - wanx2.1-i2v-plus
          - wan2.6-i2v
          - wan2.7-i2v
        # LLM consultation (second opinion / rebuttal / verification).
        chatModel: qwen3.7-max
        chatFallbackModels:
          - qwen-max
          - glm-5.2
          - MiniMax-M2.5
        # Text-to-speech (verified via qwen-tts with input.text, WAV output).
        ttsModel: qwen-tts
        ttsFallbackModels: []
        # After a successful generation, register the PNGs as durable
        # attachments and surface them in the tool-result card (UI-only
        # display; image blocks never enter the model request). Best-effort;
        # off by default.
        attachGeneratedImages: false
        # Directory for generated images; relative paths resolve against the
        # session workspace (the invoking directory).
        outputDir: generated
